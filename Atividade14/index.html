<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 14</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #042d3f;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background-color: #0a3d54;
            width: 100%;
            max-width: 400px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
            border: 1px solid #134e6b;
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 22px;
            font-weight: 600;
        }
        label {
            display: block;
            font-size: 14px;
            margin-bottom: 6px;
            color: #d0e6f2;
        }
        input[type="text"],
        input[type="email"],
        textarea {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 16px;
            border: 1px solid #1a5b7a;
            border-radius: 8px;
            background-color: #ffffff;
            color: #1a1a1a;
            font-size: 14px;
            outline: none;
        }
        input[type="text"]:focus,
        input[type="email"]:focus,
        textarea:focus {
            border-color: #0099dd;
        }
        textarea {
            height: 90px;
            resize: vertical;
        }
        .pesquisa {
            text-align: center;
            margin: 20px 0;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
        }
        .pesquisa p {
            font-size: 14px;
            margin-bottom: 8px;
        }
        .pesquisa-sub {
            font-style: italic;
            color: #b8daf0;
        }
        .radio-options {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 8px;
        }
        .radio-options label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            color: #fff;
            margin-bottom: 0;
        }
        .botoes {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 20px;
        }
        input[type="submit"],
        input[type="reset"] {
            padding: 9px 22px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        input[type="submit"] {
            background-color: #0099dd;
            color: #ffffff;
        }
        input[type="reset"] {
            background-color: #2a5a73;
            color: #ffffff;
        }
        input[type="submit"]:hover,
        input[type="reset"]:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="card">
        <form name="nomeform" onsubmit="return validar()">
            <h2>Formulário Principal</h2>

            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome">

            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email">

            <label for="comentario">Comentário:</label>
            <textarea id="comentario" name="comentario"></textarea>

            <div class="pesquisa">
                <p>Pesquisa:</p>
                <p class="pesquisa-sub">Primeira vez nesta página??</p>
                <div class="radio-options">
                    <label><input type="radio" name="pesquisa" value="Sim"> Sim</label>
                    <label><input type="radio" name="pesquisa" value="Não"> Não</label>
                </div>
            </div>

            <div class="botoes">
                <input type="submit" value="Enviar">
                <input type="reset" value="Limpar">
            </div>
        </form>
    </div>

    <script>
        function validar() {
            var f = document.nomeform;

            if (f.elements["nome"].value.length < 10) {
                alert("Nome não pode ter menos que 10 caracteres.");
                return false;
            }

            if (f.elements["email"].value === "" || f.elements["email"].value.indexOf("@") === -1 || f.elements["email"].value.indexOf(".") === -1) {
                alert("Email inválido.");
                return false;
            }

            if (f.elements["comentario"].value.length < 20) {
                alert("Comentário deve ter no mínimo 20 caracteres.");
                return false;
            }

            if (!f.elements["pesquisa"][0].checked && !f.elements["pesquisa"][1].checked) {
                alert("Pesquisa é obrigatória.");
                return false;
            }

            if (f.elements["pesquisa"][1].checked) {
                alert("Que bom que você voltou a visitar esta página!");
            } else {
                alert("Volte sempre à está página!");
            }

            return true;
        }
    </script>
</body>
</html>
